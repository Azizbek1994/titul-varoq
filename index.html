<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Javoblar varaqasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #707579);
    --btn: var(--tg-theme-button-color, #1e9bf0);
    --btn-fg: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 14px 12px calc(88px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 24px; text-align: center; margin: 8px 0 2px; }
  .sub { text-align: center; color: var(--hint); font-size: 14px; margin: 0 0 12px; word-break: break-word; }
  .legend { display: flex; align-items: center; gap: 12px; border: 2px solid var(--fg);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; font-size: 15px; }
  .legend .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fg); }
  .legend .hint { color: var(--hint); }
  .sheet { border: 2px solid var(--fg); border-radius: 18px; overflow: hidden; }
  .block { padding: 8px 6px; border-bottom: 2px solid var(--fg); }
  .block:last-child { border-bottom: 0; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 0; }
  .num { width: 34px; text-align: right; font-weight: 700; font-size: 17px; }
  .bubble { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--fg);
    background: transparent; color: var(--fg); font-size: 19px; font-family: inherit; padding: 0;
    cursor: pointer; transition: background .08s, color .08s; }
  .bubble.on { background: var(--fg); color: var(--bg); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; background: var(--bg); border-top: 1px solid var(--hint);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar .cnt { font-size: 17px; }
  .bar .cnt b { font-size: 26px; }
  .send { background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 14px;
    padding: 14px 26px; font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
  <h1 id="title">Javoblar varaqasi</h1>
  <p class="sub" id="sub"></p>
  <div class="legend">
    <span id="legendLabel">To'g'ri belgilash:</span>
    <span class="dot"></span>
    <span class="hint">— doirani bosing, qayta bossangiz bekor bo'ladi</span>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="bar">
    <div class="cnt">Belgilandi: <b id="cnt">0</b> / <span id="total">0</span></div>
    <button class="send" id="send">📤 Yuborish</button>
  </div>

<script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
  if (tg) {
    try { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); } catch (e) {}
  }

  // Bot URL parametrlari: ?m=solve|key&n=48&k=4|5&t=<id>&title=<mavzu>
  var q = new URLSearchParams(location.search);
  var mode = q.get('m') === 'key' ? 'key' : 'solve';
  var n = parseInt(q.get('n'), 10);
  var k = parseInt(q.get('k'), 10);
  if (!(n >= 1 && n <= 200)) n = 20;
  if (k !== 5) k = 4;
  var ref = q.get('t') || '';
  var topic = q.get('title') || '';
  var L = 'ABCDE'.slice(0, k).split('');
  var storeKey = 'sheet:' + mode + ':' + ref;

  document.getElementById('total').textContent = n;
  document.getElementById('sub').textContent = topic;
  if (mode === 'key') {
    document.getElementById('title').textContent = 'Kalitlar varaqasi';
    document.getElementById('legendLabel').textContent = "To'g'ri javob:";
  }

  var ans = [];
  for (var i = 0; i < n; i++) ans.push('');
  try {
    var saved = JSON.parse(localStorage.getItem(storeKey) || 'null');
    if (Array.isArray(saved) && saved.length === n) {
      ans = saved.map(function (x) { return L.indexOf(x) >= 0 ? x : ''; });
    }
  } catch (e) {}

  var sheet = document.getElementById('sheet');
  var cntEl = document.getElementById('cnt');
  var buttons = [];

  function persist() {
    try { localStorage.setItem(storeKey, JSON.stringify(ans)); } catch (e) {}
  }
  function refresh() {
    var marked = 0;
    for (var i = 0; i < n; i++) {
      if (ans[i]) marked++;
      for (var j = 0; j < k; j++) {
        buttons[i][j].classList.toggle('on', ans[i] === L[j]);
      }
    }
    cntEl.textContent = marked;
    return marked;
  }

  var block = null;
  for (var i = 0; i < n; i++) {
    if (i % 10 === 0) {
      block = document.createElement('div');
      block.className = 'block';
      sheet.appendChild(block);
    }
    var row = document.createElement('div');
    row.className = 'row';
    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = i + 1;
    row.appendChild(num);
    buttons[i] = [];
    for (var j = 0; j < k; j++) {
      (function (qi, letter) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'bubble';
        b.textContent = letter;
        b.addEventListener('click', function () {
          ans[qi] = (ans[qi] === letter) ? '' : letter;
          try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {}
          persist();
          refresh();
        });
        buttons[qi].push(b);
        row.appendChild(b);
      })(i, L[j]);
    }
    block.appendChild(row);
  }
  refresh();

  function notify(msg) {
    if (tg && tg.showAlert && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2') && inTelegram) tg.showAlert(msg);
    else alert(msg);
  }
  function ask(msg, cb) {
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2') && inTelegram) tg.showConfirm(msg, cb);
    else cb(window.confirm(msg));
  }
  function send() {
    var payload = JSON.stringify({
      m: mode,
      t: ref,
      a: ans.map(function (x) { return x || '-'; }).join('')
    });
    try { localStorage.removeItem(storeKey); } catch (e) {}
    if (inTelegram) tg.sendData(payload);   // ma'lumot botga yuboriladi va oyna yopiladi
    else alert(payload);                      // Telegramdan tashqarida sinash uchun
  }

  document.getElementById('send').addEventListener('click', function () {
    var marked = refresh();
    if (marked === 0) { notify('Hech narsa belgilanmagan.'); return; }
    if (mode === 'key') {
      if (marked < n) { notify("Barcha " + n + " ta savolning to'g'ri javobini belgilang (" + marked + "/" + n + ")."); return; }
      send();
      return;
    }
    var msg = marked < n
      ? (n - marked) + " ta savol belgilanmagan. Baribir yuborasizmi? Keyin o'zgartirib bo'lmaydi."
      : "Javoblarni yuborasizmi? Keyin o'zgartirib bo'lmaydi.";
    ask(msg, function (ok) { if (ok) send(); });
  });
})();
</script>
</body>
</html>
